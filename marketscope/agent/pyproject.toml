[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "marketscope-agent"
version = "0.1.0"
description = "MarketScope AI Agent/Engine — LangGraph DAG + 에이전트 + 워커"
requires-python = ">=3.11"
dependencies = [
    "marketscope-common",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "litellm>=1.50.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
]
