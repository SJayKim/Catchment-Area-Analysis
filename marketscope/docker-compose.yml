version: "3.9"

services:
  # ── Infrastructure ──

  postgres:
    image: postgis/postgis:15-3.4
    container_name: marketscope-postgres
    environment:
      POSTGRES_DB: marketscope
      POSTGRES_USER: marketscope_user
      POSTGRES_PASSWORD: marketscope_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketscope_user -d marketscope"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: marketscope-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Application Services ──

  marketscope-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketscope-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MCP_SERVERS: '{"public_data":"http://mcp-public-data:5100","maps":"http://mcp-maps:5101","real_estate":"http://mcp-real-estate:5102","news":"http://mcp-news:5103","regulatory":"http://mcp-regulatory:5104","finance":"http://mcp-finance:5105","database":"http://mcp-database:5106","google_maps":"http://mcp-google-maps:5107","naver_maps":"http://mcp-naver-maps:5108"}'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  marketscope-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketscope-engine
    command: python -m app.engine
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MCP_SERVERS: '{"public_data":"http://mcp-public-data:5100","maps":"http://mcp-maps:5101","real_estate":"http://mcp-real-estate:5102","news":"http://mcp-news:5103","regulatory":"http://mcp-regulatory:5104","finance":"http://mcp-finance:5105","database":"http://mcp-database:5106","google_maps":"http://mcp-google-maps:5107","naver_maps":"http://mcp-naver-maps:5108"}'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  marketscope-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketscope-pipeline
    command: python -m app.pipeline
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── MCP Servers ──

  mcp-public-data:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketscope-mcp-public-data
    command: python -m app.mcp_servers.public_data.server
    ports:
      - "5100:5100"
    env_file: .env
    restart: unless-stopped

  mcp-maps:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketscope-mcp-maps
    command: python -m app.mcp_servers.maps
    ports:
      - "5101:5101"
    env_file: .env
    restart: unless-stopped

  mcp-real-estate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketscope-mcp-real-estate
    command: python -m app.mcp_servers.real_estate.server
    ports:
      - "5102:5102"
    env_file: .env
    restart: unless-stopped

  mcp-news:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketscope-mcp-news
    command: python -m app.mcp_servers.news.server
    ports:
      - "5103:5103"
    env_file: .env
    restart: unless-stopped

  mcp-regulatory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketscope-mcp-regulatory
    command: python -m app.mcp_servers.regulatory.server
    ports:
      - "5104:5104"
    env_file: .env
    restart: unless-stopped

  mcp-finance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketscope-mcp-finance
    command: python -m app.mcp_servers.finance.server
    ports:
      - "5105:5105"
    env_file: .env
    restart: unless-stopped

  mcp-database:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketscope-mcp-database
    command: python -m app.mcp_servers.database.server
    ports:
      - "5106:5106"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcp-google-maps:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketscope-mcp-google-maps
    command: python -m app.mcp_servers.google_maps.server
    ports:
      - "5107:5107"
    env_file: .env
    restart: unless-stopped

  mcp-naver-maps:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketscope-mcp-naver-maps
    command: python -m app.mcp_servers.naver_maps.server
    ports:
      - "5108:5108"
    env_file: .env
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
