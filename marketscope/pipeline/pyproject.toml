[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "marketscope-pipeline"
version = "0.1.0"
description = "MarketScope Pipeline — 데이터 수집/전처리 스케줄러"
requires-python = ">=3.11"
dependencies = [
    "marketscope-common",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "apscheduler>=3.10.0",
    "pyproj>=3.6.0",
]

[project.scripts]
marketscope-pipeline = "marketscope_pipeline.main:main"
