[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketscope"
version = "1.0.0"
description = "MarketScope AI - 상권 분석 AI Agent Swarm"
requires-python = ">=3.11"
dependencies = [
    "marketscope-common",
    "marketscope-mcp",
    "marketscope-agent",
    "marketscope-api",
    "marketscope-pipeline",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "litellm>=1.50.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langfuse>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pyproj>=3.6.0",
    "apscheduler>=3.10.0",
    "geoalchemy2>=0.15.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.uv.workspace]
members = ["common", "mcp", "agent", "api", "pipeline"]

[tool.uv.sources]
marketscope-common = { path = "common", editable = true }
marketscope-mcp = { path = "mcp", editable = true }
marketscope-agent = { path = "agent", editable = true }
marketscope-api = { path = "api", editable = true }
marketscope-pipeline = { path = "pipeline", editable = true }
