name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff>=0.8

      - name: Ruff check
        run: ruff check server/

      - name: Ruff format check
        run: ruff format --check server/

  frontend-lint:
    name: Frontend Lint (ESLint + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Next.js lint
        run: npx next lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    env:
      USE_MOCK: "true"
      LLM_PROVIDER: "mock"
      ANTHROPIC_API_KEY: "sk-ant-test-dummy"
      GOOGLE_API_KEY: "test-dummy"
      SEOUL_OPENDATA_API_KEY: "test-dummy"
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest -v --cov=server --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage.xml
          retention-days: 14

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t marketscope-server:ci ./server

      - name: Build frontend image
        run: |
          docker build -t marketscope-frontend:ci \
            --build-arg NEXT_PUBLIC_KAKAO_MAP_KEY=ci-build-dummy \
            ./frontend

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Python dependency audit
        run: pip-audit -r <(pip install -e "./server[dev]" --dry-run --report - 2>/dev/null) || true

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: npm audit
        run: cd frontend && npm audit || true
