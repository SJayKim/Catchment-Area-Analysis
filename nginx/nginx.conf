# MarketScope AI - Nginx Reverse Proxy Configuration
# Phase 10: Serving Stability

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # --- General settings ---
    client_max_body_size 10m;

    # --- Gzip compression ---
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;
    gzip_vary on;

    # --- Security headers ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- SSE endpoint: /api/chat ---
    location /api/chat {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # SSE-specific: disable buffering for streaming
        proxy_buffering off;
        add_header X-Accel-Buffering no always;

        # Long timeout for SSE streams (5 minutes)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Connection headers (no upgrade, keep HTTP/1.1 for SSE)
        proxy_set_header Connection "";

        # Forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- General API: /api/ ---
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- Health check: /health ---
    location /health {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_read_timeout 5s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- Static assets: /_next/static/ (immutable, 1 year cache) ---
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;

        # Immutable cache: files are content-hashed by Next.js
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Re-add security headers (add_header in location block overrides server-level)
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # --- Frontend: / (default) ---
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_read_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
