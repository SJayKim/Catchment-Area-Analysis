services:
  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: marketscope
      POSTGRES_USER: marketscope
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketscope"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # --- 마이그레이션 (init container, 실행 후 종료) ---
  migrate:
    build: { context: ./server, target: runner }
    command: alembic upgrade head
    environment:
      DATABASE_URL_SYNC: postgresql://marketscope:devpassword@db:5432/marketscope
    depends_on:
      db: { condition: service_healthy }

  # --- 시드 데이터 복원 (마이그레이션 후, 데이터 없을 때만 실행) ---
  seed:
    image: postgis/postgis:16-3.4
    command: >
      bash -c "
        COUNT=$$(psql -U marketscope -d marketscope -h db -tAc 'SELECT count(*) FROM districts')
        if [ \"$$COUNT\" -gt 0 ]; then
          echo 'Seed: districts already has $$COUNT rows — skipping'
        else
          echo 'Seed: loading seed data...'
          pg_restore --no-owner --no-acl -U marketscope -d marketscope -h db /seed/marketscope_seed.dump || true
          echo 'Seed: done'
        fi
      "
    environment:
      PGPASSWORD: devpassword
    volumes:
      - ./data/seed:/seed:ro
    depends_on:
      migrate: { condition: service_completed_successfully }

  # --- Production 서비스 ---
  backend:
    build: { context: ./server, target: runner }
    ports: ["8000:8000"]
    environment:
      USE_MOCK: ${USE_MOCK:-false}
      DATABASE_URL: postgresql+asyncpg://marketscope:devpassword@db:5432/marketscope
      DATABASE_URL_SYNC: postgresql://marketscope:devpassword@db:5432/marketscope
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AGENT_MODE: ${AGENT_MODE:-pae}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY:-}
        NEXT_PUBLIC_API_URL: http://backend:8000
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY:-}
    depends_on:
      backend: { condition: service_healthy }

  # --- Dev 프로필 (docker compose --profile dev up) ---
  backend-dev:
    profiles: [dev]
    build: { context: ./server }
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    volumes: [./server:/app]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://marketscope:devpassword@db:5432/marketscope
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend-dev:
    profiles: [dev]
    build: { context: ./frontend, target: deps }
    command: npx next dev --port 3000
    ports: ["3000:3000"]
    volumes: [./frontend:/app, /app/node_modules]
    environment:
      NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY:-}
      NEXT_PUBLIC_API_URL: http://backend-dev:8000
    depends_on: [backend-dev]

volumes:
  pgdata:
