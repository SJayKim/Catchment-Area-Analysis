[project]
name = "marketscope-server"
version = "0.3.0"
description = "MarketScope AI - 상권분석 AI 서비스 백엔드"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "geoalchemy2>=0.15",
    # Cache
    "redis>=5.0",
    # ETL
    "httpx>=0.28",
    "tenacity>=9.0",
    "geopandas>=1.0",
    # AI / Agent
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-core>=0.3",
    "langfuse>=2.0",
    # SSE
    "sse-starlette>=2.0",
    # Middleware
    "slowapi>=0.1.9",
    "structlog>=24.0",
    # Config
    "pydantic-settings>=2.6",
    # CLI
    "typer>=0.15",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
loadtest = [
    "locust>=2.29",
    "httpx>=0.27",
]

[project.scripts]
etl = "server.data.etl.runner:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
