[project]
name = "marketscope-server"
version = "0.3.0"
description = "MarketScope AI - 상권분석 AI 서비스 백엔드"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "geoalchemy2>=0.15",
    # Cache
    "redis>=5.0",
    # ETL
    "httpx>=0.28",
    "tenacity>=9.0",
    "geopandas>=1.0",
    # AI / Agent
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-core>=0.3",
    # langfuse v3 는 `langchain` 풀패키지 + modern `langchain_core` 에 의존.
    # v2 는 legacy `langchain.callbacks.base` 를 요구했고 langchain 1.x 에서 제거됨 → v3 로 상향.
    # `langfuse_tracer.py` 가 `langfuse.langchain.CallbackHandler` + `TraceContext(trace_id=...)` 패턴 사용.
    # ADR: docs/plan/infra/llmops-l1-adr-hosting.md · docs/plan/infra/llmops-l1-verification.md
    "langfuse>=3,<4",
    "langchain>=1,<2",
    # SSE
    "sse-starlette>=2.0",
    # Middleware
    "slowapi>=0.1.9",
    "structlog>=24.0",
    # Config
    "pydantic-settings>=2.6",
    # CLI
    "typer>=0.15",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
loadtest = [
    "locust>=2.29",
    "httpx>=0.27",
]

[project.scripts]
etl = "server.data.etl.runner:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.ruff]
target-version = "py312"
# 한국어 프롬프트/에러 메시지가 많아 100 기준으로는 과도한 가독성 저하. 120 으로 운영.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 시스템/플래너 프롬프트, Few-shot 예시, 추론 힌트 등 의도된 장문 한국어 텍스트.
"server/agent/nodes/respond.py" = ["E501"]
"server/agent/prompts/*.py" = ["E501"]
"server/agent/graph.py" = ["E501"]
# FastAPI 미들웨어/라우터 등록 순서가 의존하는 import — 상단 이동 시 순서 어긋남.
"server/main.py" = ["E402"]
# Typer CLI 관례: Option/Argument 를 기본값으로 호출. 가독성 유지 위해 허용.
"server/data/etl/runner.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
